services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - 8088:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./dist_keycloak/otterscale-theme.jar:/opt/keycloak/providers/otterscale-theme.jar
    command: start-dev
